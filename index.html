<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HackTrack — Live hackathon command center. Track evaluations, team status, and announcements in real-time." />
  <meta property="og:title" content="HackTrack — Live Hackathon Dashboard" />
  <meta property="og:description" content="Real-time hackathon command center for organizers and participants." />
  <meta property="og:type" content="website" />
  <title>HackTrack — Live Hackathon Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23b142ff' /></svg>" />
</head>
<body>
  <!-- Skip to content link for keyboard/screen reader users -->
  <a href="#main-content" class="skip-link" id="skip-link">Skip to main content</a>

  <!-- Keyboard shortcut overlay -->
  <div id="shortcut-overlay" class="shortcut-overlay" role="dialog" aria-label="Keyboard shortcuts" aria-hidden="true" tabindex="-1">
    <div class="shortcut-overlay__backdrop"></div>
    <div class="shortcut-overlay__content">
      <div class="shortcut-overlay__header">
        <h2>Keyboard Shortcuts</h2>
        <span class="kbd-hint">Press <kbd>?</kbd> or <kbd>Esc</kbd> to close</span>
      </div>
      <div class="shortcut-overlay__body" id="shortcut-list">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Toast container for live announcements -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Screen reader live region -->
  <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Main app root -->
  <div id="app">
    <header id="app-header" role="banner"></header>
    <main id="main-content" role="main" tabindex="-1"></main>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
